<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Directory Terminal</title>
    <style>
        #matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #0d0208;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            padding: 16px 24px;
            margin: 0;
        }

        .status-bar {
            text-align: right;
            font-size: 0.8em;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.5);
            padding: 5px;
        }

        .terminal-header {
            background-color: rgba(13, 2, 8, 0.9);
            border: 1px solid #00ff41;
            padding: 16px 24px;
            margin-bottom: 14px;
        }

        .terminal-header h1 {
            font-size: 2rem;
            margin: 0 0 18px 0;
        }

        .terminal-header h2 {
            font-size: 1.5rem;
            margin: 0 0 16px 0;
        }

        .terminal-header p {
            margin: 0;
        }

        .profile-card {
            background-color: rgba(0, 0, 0, 0.75);
            border: 1px solid #00ff41;
            margin: 12px 0;
            padding: 14px 18px;
            box-shadow: 0 0 8px rgba(0, 255, 65, 0.18);
        }

        /* Fixed the border override issue here */
        #terminal-search {
            width: 95%;
            display: block;
            margin-top: 8px;
            border: 1px dashed #00ff41; 
        }

        input, button {
            background-color: #0d0208;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 10px;
            margin: 4px;
            font-family: 'Courier New', monospace;
        }

        button:hover {
            background-color: #00ff41;
            color: #0d0208;
            cursor: pointer;
        }

        .delete-btn {
            color: #ff0000 !important;
            border-color: #ff0000 !important;
            font-size: 0.8em;
        }

        .error-container {
            border: 1px dashed #ff0000;
            background-color: rgba(20, 0, 0, 0.6);
            color: #ff3333;
            padding: 12px;
            margin: 10px 0;
        }

        .typing::after {
            content: "█";
            display: inline-block;
            margin-left: 4px;
            color: #00ff41;
            animation: blink 0.8s infinite steps(2);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .compact-section {
            padding-top: 14px;
            padding-bottom: 14px;
        }
    </style>
</head>
<body>
    <canvas id="matrix-rain"></canvas>

    <div class="status-bar">
        STATUS: <span id="server-status">ONLINE</span> | MEMBERS_SYNCED: <span id="member-count">0</span>
    </div>

    <div class="terminal-header">
        <h1 id="terminal-title">> HACKER_DIRECTORY_V2.EXE</h1>
        <p>> SYSTEM_VIBE: <span id="vibe-text">ANALYZING...</span></p>
    </div>

    <div class="terminal-header">
        <h2>> SEARCH_DATABASE.exe</h2>
        <span style="color: #00ff41;">> </span>
        <input type="text" id="terminal-search" placeholder="TYPE_NAME...">
    </div>

    <div class="terminal-header compact-section">
        <h2>> SHARED_SKILL_NETWORK.exe</h2>
        <button type="button" id="toggle-skills-btn">_ANALYZE_SKILLS</button>
        <div id="skill-network" style="display: none; margin-top: 12px;"></div>
    </div>
    
    <div class="terminal-header">
        <h2>> JOIN_THE_MAINFRAME.exe</h2>
        <form id="join-form">
            <input type="text" id="name" placeholder="NAME" required>
            <input type="text" id="skill" placeholder="SKILL" required>
            <input type="text" id="github" placeholder="GITHUB_USER" required>
            <input type="password" id="passkey" placeholder="SECRET_PASSKEY" required>
            <button type="submit">_SUBMIT_DATA</button>
        </form>
    </div>

    <div class="terminal-header">
        <h2>> ACTIVE_HACKER_PROFILES.exe</h2>
        <div id="hacker-list"></div>
    </div>

    <script>
        const BASE_URL = "https://kgs-guestbook-api.onrender.com";
        let isTyping = false;
        let lastVibe = "";
        let latestHackers = [];

        // Global DOM Elements
        const hackerListEl = document.getElementById("hacker-list");
        const serverStatusEl = document.getElementById("server-status");
        const memberCountEl = document.getElementById("member-count");
        const vibeTextEl = document.getElementById("vibe-text");
        const skillNetworkEl = document.getElementById("skill-network");
        const searchInputEl = document.getElementById("terminal-search");

        function typeWriter(text, element, speed, callback) {
            isTyping = true;
            let i = 0;
            const targetEl = typeof element === "string" ? document.getElementById(element) : element;
            
            if (!targetEl) return;

            if (targetEl.typewriterTimer) {
                clearTimeout(targetEl.typewriterTimer);
            }

            targetEl.classList.remove("typing");
            targetEl.innerHTML = "";
            targetEl.classList.add("typing");

            function type() {
                if (i < text.length) {
                    targetEl.innerHTML += text.charAt(i);
                    i++;
                    targetEl.typewriterTimer = setTimeout(type, speed);
                } else {
                    isTyping = false;
                    targetEl.classList.remove("typing");
                    targetEl.typewriterTimer = null;
                    if (callback) callback();
                }
            }
            type();
        }

        // State-driven rendering component
        function renderHackers(hackersList) {
            hackerListEl.innerHTML = "";
            
            if (hackersList.length === 0) {
                hackerListEl.innerHTML = "<p>> NO_RECORD_FOUND_IN_DATABASE</p>";
                return;
            }

            hackersList.forEach(h => {
                const card = document.createElement("div");
                card.className = "profile-card";
                card.innerHTML = `
                    <h3>> USER: ${escapeHtml(h.name)}</h3>
                    <p>SKILL: ${escapeHtml(h.skill)}</p>
                    <p>GITHUB_USER: ${escapeHtml(h.github_username)}</p>
                    <button class="delete-btn">[DELETE]</button>
                `;

                // Securely attach single-event listeners instead of string interpolation
                card.querySelector(".delete-btn").addEventListener("click", () => deleteUser(h.name));
                hackerListEl.appendChild(card);
            });
        }

        async function updateData(animateVibe = false) {
            try {
                // Fetch Profiles
                const res = await fetch(`${BASE_URL}/profiles`);
                if (!res.ok) throw new Error("Failed to pull network records.");
                const data = await res.json();

                latestHackers = [...data].reverse();
                
                // Active update on UI based on current search state
                filterHackers();

                if (skillNetworkEl.style.display === "block") {
                    updateSkillNetwork(latestHackers);
                }

                // Fetch Stats
                const sRes = await fetch(`${BASE_URL}/stats`);
                if (sRes.ok) {
                    const sData = await sRes.json();
                    memberCountEl.innerText = sData.total_hackers;
                }

                // Fetch Vibe Analytics
                const vRes = await fetch(`${BASE_URL}/vibe`);
                if (vRes.ok) {
                    const vData = await vRes.json();
                    if (vData.vibe !== lastVibe) {
                        lastVibe = vData.vibe;
                        if (animateVibe) {
                            typeWriter(vData.vibe, vibeTextEl, 80);
                        } else {
                            if (vibeTextEl.typewriterTimer) {
                                clearTimeout(vibeTextEl.typewriterTimer);
                                vibeTextEl.typewriterTimer = null;
                            }
                            vibeTextEl.classList.remove("typing");
                            vibeTextEl.innerText = vData.vibe;
                        }
                    }
                }

                if (!isTyping) {
                    serverStatusEl.classList.remove("typing");
                    serverStatusEl.innerText = "ONLINE";
                    serverStatusEl.style.color = "#00ff41";
                }
            } catch (e) {
                console.error("Data Fetch Exception:", e);
                if (!isTyping) {
                    serverStatusEl.classList.remove("typing");
                    serverStatusEl.innerText = "OFFLINE";
                    serverStatusEl.style.color = "#ff0000";
                }
                hackerListEl.innerHTML = `
                    <div class="error-container">
                        > [CRITICAL_ERROR]: MAINFRAME_API_UNREACHABLE.<br>
                        > DESCRIPTION: ${e.message || "Unknown hardware glitch."}
                    </div>`;
            }
        }

        // Clean client-side dynamic filtering array processing
        function filterHackers() {
            const searchTerm = searchInputEl.value.toLowerCase();
            const filtered = latestHackers.filter(hacker => 
                hacker.name.toLowerCase().includes(searchTerm)
            );
            renderHackers(filtered);
        }

        // Submit form handler
        document.getElementById('join-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                name: document.getElementById('name').value,
                skill: document.getElementById('skill').value,
                github_username: document.getElementById('github').value,
                passkey: document.getElementById('passkey').value
            };

            try {
                const response = await fetch(`${BASE_URL}/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("SUCCESS: Added to mainframe. Welcome to the club!");
                    updateData(false);
                    e.target.reset();
                } else {
                    alert("ERROR: Mainframe rejected payload structure.");
                }
            } catch (err) {
                alert("CRITICAL CONNECTION TIMEOUT");
            }
        });

        async function deleteUser(name) {
            const key = prompt(`Enter passkey for ${name}:`);
            if (!key) return;

            try {
                // Ideally, change backend endpoints to handle passkeys in header or body context
                const response = await fetch(`${BASE_URL}/delete/${encodeURIComponent(name)}/${encodeURIComponent(key)}`, { 
                    method: 'DELETE' 
                });

                if (response.ok) {
                    alert("SUCCESS: Profile dropped from records.");
                    updateData(false);
                } else {
                    const result = await response.json();
                    alert("ACCESS DENIED: " + (result.detail || "Invalid credential passkey token."));
                }
            } catch (err) {
                alert("CRITICAL ERROR DURING RECORD CLEARANCE");
            }
        }

        function updateSkillNetwork(data) {
            const skillGroups = {};
            skillNetworkEl.innerHTML = "";

            data.forEach(hacker => {
                const skill = hacker.skill ? hacker.skill.trim().toLowerCase() : "";
                const name = hacker.name ? hacker.name.trim() : "";

                if (!skill || !name) return;
                if (!skillGroups[skill]) skillGroups[skill] = [];
                
                skillGroups[skill].push(name);
            });

            const sortedSkills = Object.entries(skillGroups).sort((a, b) => b[1].length - a[1].length);

            if (sortedSkills.length === 0) {
                skillNetworkEl.innerText = "NO_SKILL_CONNECTIONS_FOUND";
                return;
            }

            sortedSkills.forEach(([skill, names]) => {
                const line = document.createElement("p");
                const label = names.length === 1 ? "hacker" : "hackers";
                line.innerText = `> ${skill.toUpperCase()}: ${names.length} ${label} - ${names.join(", ")}`;
                skillNetworkEl.appendChild(line);
            });
        }

        function toggleSkillNetwork() {
            if (skillNetworkEl.style.display === "none") {
                updateSkillNetwork(latestHackers);
                skillNetworkEl.style.display = "block";
            } else {
                skillNetworkEl.style.display = "none";
            }
        }

        // Sanitizer helper targeting potential script insertion vulnerabilities
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Setup Event Listeners programmatically
        searchInputEl.addEventListener("input", filterHackers);
        document.getElementById("toggle-skills-btn").addEventListener("click", toggleSkillNetwork);

        // --- Matrix Animation Engine ---
        const canvas = document.getElementById('matrix-rain');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const chars = "0123456789ABCDEF";
        const drops = Array(Math.floor(canvas.width / 16)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(13,2,8,0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00ff41";
            ctx.font = "16px monospace";

            drops.forEach((y, i) => {
                ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 16, y * 16);
                if (y * 16 > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            });
        }
        setInterval(draw, 33);

        // Application Initialization Lifecycle
        typeWriter("> HACKER_DIRECTORY_V2.EXE", "terminal-title", 50, () => {
            typeWriter("ESTABLISHING_SECURE_CONNECTION...", serverStatusEl, 40, () => {
                updateData(true);
                setInterval(() => updateData(true), 30000);
            });
        });
    </script>
</body>
</html>
