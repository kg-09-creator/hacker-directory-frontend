<!DOCTYPE html>
<html>
<head>
    <title>Hacker Directory Terminal</title>
    <style>

        .typewriter-cursor {
    display: inline-block;
    width: 0.65ch;
    height: 1em;
    margin-left: 2px;
    background-color: #00ff41;
    vertical-align: -0.12em;
    animation: blink-cursor 0.8s steps(1) infinite;
}

@keyframes blink-cursor {
    50% {
        opacity: 0;
    }
}
        
        #matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            width: 100%;
            height: 100%;
        }
        body {
            background-color: #0d0208;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            padding: 20px;
            margin: 0;
        }
        .status-bar {
            text-align: right;
            font-size: 0.8em;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.5);
            padding: 5px;
        }
        .terminal-header {
            background-color: rgba(13, 2, 8, 0.9);
            border: 1px solid #00ff41;
            padding: 20px;
            margin-bottom: 20px;
        }
        .profile-card {
            background-color: rgba(13, 2, 8, 0.85);
            border: 1px solid #00ff41;
            margin: 15px 0;
            padding: 15px;
        }
        input, button {
            background-color: #0d0208;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 10px;
            margin: 5px;
            font-family: 'Courier New', monospace;
        }
        #terminal-search {
            width: 95%;
            display: block;
            margin-top: 10px;
            border-style: dashed;
        }
        button:hover {
            background-color: #00ff41;
            color: #0d0208;
            cursor: pointer;
        }
        .delete-btn {
            color: #ff0000 !important;
            border-color: #ff0000 !important;
            font-size: 0.8em;
        }
        /* Structural cursor rule mapping */
        .typing::after {
            content: "█";
            animation: blink 0.8s infinite steps(2);
            margin-left: 4px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <canvas id="matrix-rain"></canvas>
    
    <div class="status-bar">
        STATUS: <span id="server-status" class="typing">ONLINE</span> | MEMBERS_SYNCED: <span id="member-count">0</span>
    </div>

    <div class="terminal-header">
        <!-- FIXED: Added explicit id marker attribute tags to prevent render crashes -->
        <h1 id="terminal-title">> HACKER_DIRECTORY_V2.EXE</h1>
        <p>> SYSTEM_VIBE: <span id="vibe-text">ANALYZING...</span></p>
    </div>

    <div class="terminal-header">
        <h2>> SEARCH_DATABASE.exe</h2>
        <span style="color: #00ff41;">> </span>
        <input type="text" id="terminal-search" placeholder="TYPE_NAME..." oninput="filterHackers()">
    </div>

    <div class="terminal-header">
        <h2>> JOIN_THE_MAINFRAME.exe</h2>
        <form id="join-form">
            <input type="text" id="name" placeholder="NAME" required>
            <input type="text" id="skill" placeholder="SKILL" required>
            <input type="text" id="github" placeholder="GITHUB_USER" required>
            <input type="password" id="passkey" placeholder="SECRET_PASSKEY" required>
            <button type="submit">_SUBMIT_DATA</button>
        </form>
    </div>

    <div id="hacker-list"></div>

    <script>
        const BASE_URL = "https://kgs-guestbook-api.onrender.com";
        let isBooting = true; 

        async function hashPasskey(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

function typeWriter(text, elementId, speed, callback) {
    isTyping = true;
    let i = 0;

    const element = document.getElementById(elementId);
    if (!element) return;

    element.innerHTML = "";

    const textNode = document.createTextNode("");
    const cursor = document.createElement("span");
    cursor.className = "typewriter-cursor";

    element.appendChild(textNode);
    element.appendChild(cursor);

    function type() {
        if (i < text.length) {
            textNode.textContent += text.charAt(i);
            i++;
            setTimeout(type, speed);
        } else {
            isTyping = false;

            // Remove this line if you want the cursor to keep blinking after typing finishes
            cursor.remove();

            if (callback) callback();
        }
    }

    type();
}

            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else {
                    element.classList.remove("typing");
                    if (callback) callback(); 
                }
            }
            type();
        }

        async function updateData() {
            try {
                const res = await fetch(`${BASE_URL}/profiles`);
                const data = await res.json();
                const list = document.getElementById("hacker-list");
                list.innerHTML = "";
                data.forEach(h => {
                    const card = document.createElement("div");
                    card.className = "profile-card";
                    card.innerHTML = `<h3>> USER: ${h.name}</h3><p>SKILL: ${h.skill}</p><button class="delete-btn" onclick="deleteUser('${h.name}')">[DELETE]</button>`;
                    list.appendChild(card);
                });

                const sRes = await fetch(`${BASE_URL}/stats`);
                const sData = await sRes.json();
                document.getElementById("member-count").innerText = sData.total_hackers;

                const vRes = await fetch(`${BASE_URL}/vibe`);
                const vData = await vRes.json();
                
                // Triggers the typewriter data mapping sequence cleanly
                typeWriter(vData.vibe, "vibe-text", 80);

                if (!isBooting) {
                    document.getElementById("server-status").innerText = "ONLINE";
                }
            } catch (e) {
                if (!isBooting) {
                    document.getElementById("server-status").innerText = "OFFLINE";
                }
            }
        }

        document.getElementById('join-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const plainPasskey = document.getElementById('passkey').value;
            const secureHash = await hashPasskey(plainPasskey);

            const payload = {
                name: document.getElementById('name').value,
                skill: document.getElementById('skill').value,
                github_username: document.getElementById('github').value,
                passkey: secureHash 
            };

            const response = await fetch(`${BASE_URL}/join`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (response.ok) {
                alert("SUCCESS: Added to mainframe.");
                updateData();
                e.target.reset();
            }
        });

        async function deleteUser(name) {
            const key = prompt(`Enter passkey for ${name}:`);
            if (!key) return;
            const secureDeleteHash = await hashPasskey(key);
            try {
                const response = await fetch(`${BASE_URL}/delete/${name}/${secureDeleteHash}`, { method: 'DELETE' });
                if (response.ok) {
                    alert("SUCCESS: Profile deleted.");
                    updateData();
                } else {
                    const result = await response.json();
                    alert("ACCESS DENIED: " + (result.detail || "Invalid passkey."));
                }
            } catch (err) {
                alert("CRITICAL ERROR");
            }
        }

        function filterHackers() {
            const searchTerm = document.getElementById('terminal-search').value.toLowerCase();
            const cards = document.querySelectorAll('.profile-card');
            cards.forEach(card => {
                const nameText = card.querySelector('h3').innerText.toLowerCase();
                card.style.display = nameText.includes(searchTerm) ? "block" : "none";
            });
        }

        const canvas = document.getElementById('matrix-rain');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const chars = "0123456789ABCDEF";
        const drops = Array(Math.floor(canvas.width/16)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(13,2,8,0.1)";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "#00ff41";
            ctx.font = "16px monospace";
            drops.forEach((y, i) => {
                ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*16, y*16);
                if(y*16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }

        setInterval(draw, 33);
        
        // Boot order pipeline
        typeWriter("> HACKER_DIRECTORY_V2.EXE", "terminal-title", 50, function() {
            typeWriter("ESTABLISHING_SECURE_CONNECTION...", "server-status", 40, function() {
                isBooting = false; 
                updateData();
                setInterval(updateData, 30000); 
            });
        });
    </script>
</body>
</html>
