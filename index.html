<script>
    const BASE_URL = "https://kgs-guestbook-api.onrender.com";
    let isTyping = false; 

    // Setup the audio engine container
    let globalAudioCtx = null;

    function playTerminalClick() {
        try {
            // Create the sound system if it doesn't exist yet
            if (!globalAudioCtx) {
                globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            // If the browser is still blocking it, skip so it doesn't crash
            if (globalAudioCtx.state === 'suspended') {
                return; 
            }

            const oscillator = globalAudioCtx.createOscillator();
            const gainNode = globalAudioCtx.createGain();
            
            // Retro synth beep pitch
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(850, globalAudioCtx.currentTime); 
            
            // VOLUME BOOST: Increased from 0.015 to 0.1 for a clear, loud click
            gainNode.gain.setValueAtTime(0.1, globalAudioCtx.currentTime); 
            
            oscillator.connect(gainNode);
            gainNode.connect(globalAudioCtx.destination);
            
            oscillator.start();
            // Made the click sound slightly longer so it's easier to hear
            oscillator.stop(globalAudioCtx.currentTime + 0.03); 
        } catch (e) {
            // Fails silently if sound systems are broken
        }
    }

    // UNMUTE PIPELINE: Forces the browser to turn on the website's audio
    function unlockAudio() {
        if (!globalAudioCtx) {
            globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (globalAudioCtx.state === 'suspended') {
            globalAudioCtx.resume().then(() => {
                // Instantly play a click sound when unmuted to prove it works!
                playTerminalClick();
            });
        } else {
            playTerminalClick();
        }
    }

    // Watch the whole page for any click or keyboard tap to unlock the sound engine
    window.addEventListener('click', unlockAudio);
    window.addEventListener('keydown', unlockAudio);

    async function hashPasskey(password) {
        const msgBuffer = new TextEncoder().encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function typeWriter(text, elementId, speed, callback) {
        isTyping = true;
        let i = 0;
        const element = document.getElementById(elementId);
        if (!element) return;
        
        element.classList.add("typing");
        element.innerHTML = ""; 

        function type() {
            if (i < text.length) {
                element.innerHTML += text.charAt(i);
                playTerminalClick(); // Types out with the louder volume setting
                i++;
                setTimeout(type, speed);
            } else {
                isTyping = false; 
                element.classList.remove("typing");
                if (callback) callback(); 
            }
        }
        type();
    }

    async function updateData() {
        try {
            const res = await fetch(`${BASE_URL}/profiles`);
            const data = await res.json();
            const list = document.getElementById("hacker-list");
            list.innerHTML = "";
            data.forEach(h => {
                const card = document.createElement("div");
                card.className = "profile-card";
                card.innerHTML = `<h3>> USER: ${h.name}</h3><p>SKILL: ${h.skill}</p><button class="delete-btn" onclick="deleteUser('${h.name}')">[DELETE]</button>`;
                list.appendChild(card);
            });

            const sRes = await fetch(`${BASE_URL}/stats`);
            const sData = await sRes.json();
            document.getElementById("member-count").innerText = sData.total_hackers;

            const vRes = await fetch(`${BASE_URL}/vibe`);
            const vData = await vRes.json();
            
            document.getElementById("vibe-text").classList.add("typing");
            typeWriter(vData.vibe, "vibe-text", 80, function() {
                document.getElementById("vibe-text").classList.remove("typing");
            });

            if (!isTyping) {
                document.getElementById("server-status").innerText = "ONLINE";
            }
        } catch (e) {
            if (!isTyping) {
                document.getElementById("server-status").innerText = "OFFLINE";
            }
        }
    }

    document.getElementById('join-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        playTerminalClick(); 
        
        const plainPasskey = document.getElementById('passkey').value;
        const secureHash = await hashPasskey(plainPasskey);

        const payload = {
            name: document.getElementById('name').value,
            skill: document.getElementById('skill').value,
            github_username: document.getElementById('github').value,
            passkey: secureHash 
        };

        const response = await fetch(`${BASE_URL}/join`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (response.ok) {
            alert("SUCCESS: Added hashed credential data to mainframe.");
            updateData();
            e.target.reset();
        }
    });

    async function deleteUser(name) {
        const key = prompt(`Enter passkey for ${name}:`);
        if (!key) return;
        
        const secureDeleteHash = await hashPasskey(key);
        try {
            const response = await fetch(`${BASE_URL}/delete/${name}/${secureDeleteHash}`, { method: 'DELETE' });
            if (response.ok) {
                alert("SUCCESS: Profile destroyed.");
                updateData();
            } else {
                const result = await response.json();
                alert("ACCESS DENIED: " + (result.detail || "Invalid passkey."));
            }
        } catch (err) {
            alert("CRITICAL CONNECTION ERROR");
        }
    }

    function filterHackers() {
        const searchTerm = document.getElementById('terminal-search').value.toLowerCase();
        const cards = document.querySelectorAll('.profile-card');
        cards.forEach(card => {
            const nameText = card.querySelector('h3').innerText.toLowerCase();
            card.style.display = nameText.includes(searchTerm) ? "block" : "none";
        });
    }

    // Matrix Rain Canvas Loop
    const canvas = document.getElementById('matrix-rain');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const chars = "0123456789ABCDEF";
    const drops = Array(Math.floor(canvas.width/16)).fill(1);

    function draw() {
        ctx.fillStyle = "rgba(13,2,8,0.1)";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#00ff41";
        ctx.font = "16px monospace";
        drops.forEach((y, i) => {
            ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*16, y*16);
            if(y*16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }

    setInterval(draw, 33);
    
    // Start terminal boot sequence
    typeWriter("> HACKER_DIRECTORY_V2.EXE", "terminal-title", 50, function() {
        typeWriter("ESTABLISHING_SECURE_CONNECTION...", "server-status", 40, function() {
            updateData();
            setInterval(updateData, 30000);
        });
    });
</script>
