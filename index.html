<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Directory Terminal</title>
    <style>
        #matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #0d0208;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            padding: 16px 24px;
            margin: 0;
        }

        .status-bar {
            text-align: right;
            font-size: 0.8em;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.5);
            padding: 5px;
        }

        .terminal-header {
            background-color: rgba(13, 2, 8, 0.9);
            border: 1px solid #00ff41;
            padding: 16px 24px;
            margin-bottom: 14px;
        }

        .terminal-header h1 {
            font-size: 2rem;
            margin: 0 0 18px 0;
        }

        .terminal-header h2 {
            font-size: 1.5rem;
            margin: 0 0 16px 0;
        }

        .terminal-header p {
            margin: 0;
        }

        .profile-card {
            background-color: rgba(0, 0, 0, 0.75);
            border: 1px solid #00ff41;
            margin: 12px 0;
            padding: 14px 18px;
            box-shadow: 0 0 8px rgba(0, 255, 65, 0.18);
        }

        #terminal-search {
            width: 95%;
            display: block;
            margin-top: 8px;
            border: 1px dashed #00ff41; 
        }

        input, button {
            background-color: #0d0208;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 10px;
            margin: 4px;
            font-family: 'Courier New', monospace;
        }

        button:hover {
            background-color: #00ff41;
            color: #0d0208;
            cursor: pointer;
        }

        .delete-btn {
            color: #ff0000 !important;
            border-color: #ff0000 !important;
            font-size: 0.8em;
        }

        .error-container {
            border: 1px dashed #ff0000;
            background-color: rgba(20, 0, 0, 0.6);
            color: #ff3333;
            padding: 12px;
            margin: 10px 0;
        }

        .typing::after {
            content: "█";
            display: inline-block;
            margin-left: 4px;
            color: #00ff41;
            animation: blink 0.8s infinite steps(2);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .compact-section {
            padding-top: 14px;
            padding-bottom: 14px;
        }
    </style>
</head>
<body>
    <canvas id="matrix-rain"></canvas>

    <div class="status-bar">
        STATUS: <span id="server-status">ONLINE</span> | MEMBERS_SYNCED: <span id="member-count">0</span>
    </div>

    <div class="terminal-header">
        <h1 id="terminal-title">> HACKER_DIRECTORY_V2.EXE</h1>
        <p>> SYSTEM_VIBE: <span id="vibe-text">ANALYZING...</span></p>
    </div>

    <div class="terminal-header">
        <h2>> SEARCH_DATABASE.exe</h2>
        <span style="color: #00ff41;">> </span>
        <input type="text" id="terminal-search" placeholder="TYPE_NAME...">
    </div>

    <div class="terminal-header compact-section">
        <h2>> SHARED_SKILL_NETWORK.exe</h2>
        <button type="button" id="toggle-skills-btn">_ANALYZE_SKILLS</button>
        <div id="skill-network" style="display: none; margin-top: 12px;"></div>
    </div>
    
    <div class="terminal-header">
        <h2>> JOIN_THE_TERMINAL.exe</h2>
        <form id="join-form">
            <input type="text" id="name" placeholder="NAME" required>
            <input type="text" id="skill" placeholder="SKILL" required>
            <input type="text" id="github" placeholder="GITHUB_USER" required>
            <input type="password" id="passkey" placeholder="SECRET_PASSKEY" required>
            <button type="submit">_SUBMIT_DATA</button>
        </form>
    </div>

    <div class="terminal-header">
        <h2>> ACTIVE_HACKER_PROFILES.exe</h2>
        <div id="hacker-list"></div>
    </div>

    <script>
    const BASE_URL = "https://kgs-guestbook-api.onrender.com";
let isTyping = false;
let lastVibe = "";
let latestHackers = [];

const hackerListEl = document.getElementById("hacker-list");
const serverStatusEl = document.getElementById("server-status");
const memberCountEl = document.getElementById("member-count");
const vibeTextEl = document.getElementById("vibe-text");
const skillNetworkEl = document.getElementById("skill-network");
const searchInputEl = document.getElementById("terminal-search");
const joinFormEl = document.getElementById("join-form");

// Helper function to prevent XSS vulnerability crashes
function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function typeWriter(text, element, speed, callback) {
    isTyping = true;
    let i = 0;
    const targetEl = typeof element === "string" ? document.getElementById(element) : element;
    
    if (!targetEl) return;

    if (targetEl.typewriterTimer) {
        clearTimeout(targetEl.typewriterTimer);
    }

    targetEl.classList.remove("typing");
    targetEl.innerHTML = "";
    targetEl.classList.add("typing");

    function type() {
        if (i < text.length) {
            targetEl.innerHTML += text.charAt(i);
            i++;
            targetEl.typewriterTimer = setTimeout(type, speed);
        } else {
            isTyping = false;
            targetEl.classList.remove("typing");
            targetEl.typewriterTimer = null;
            if (callback) callback();
        }
    }
    type();
}

function renderHackers(hackersList) {
    hackerListEl.innerHTML = "";
    
    if (hackersList.length === 0) {
        hackerListEl.innerHTML = "<p>> NO_RECORD_FOUND_IN_DATABASE</p>";
        return;
    }

    const fragment = document.createDocumentFragment();

    hackersList.forEach(h => {
        const card = document.createElement("div");
        card.className = "profile-card";
        card.innerHTML = `
            <h3>> USER: ${escapeHtml(h.name)}</h3>
            <p>SKILL: ${escapeHtml(h.skill)}</p>
            <p>GITHUB_USER: ${escapeHtml(h.github_username)}</p>
            <button class="delete-btn">[DELETE]</button>
        `;

        card.querySelector(".delete-btn").addEventListener("click", () => deleteUser(h.name));
        fragment.appendChild(card);
    });

    hackerListEl.appendChild(fragment);
}

async function fetchWithRetry(url, options = {}, retries = 3) {
    for (let i = 0; i < retries; i++) {
        try {
            const res = await fetch(url, options);
            if (res.ok) return res;
        } catch (e) {
            if (i === retries - 1) throw e;
            console.warn(`[Network] Mainframe unresponsive. Spin-up retry: ${i + 1}/${retries}`);
            await new Promise(r => setTimeout(r, 2000));
        }
    }
    return fetch(url, options);
}

// 1. FIXED INCOMPLETE FUNCTION
async function updateData(animateVibe = false) {
    try {
        serverStatusEl.textContent = "SYNCING...";
        const res = await fetchWithRetry(`${BASE_URL}/profiles`);
        if (!res.ok) throw new Error("Failed to pull network records.");
        const data = await res.json();

        latestHackers = [...data].reverse();
        
        filterHackers();

        if (skillNetworkEl.style.display === "block") {
            updateSkillNetwork(latestHackers);
        }

        const sRes = await fetch(`${BASE_URL}/stats`);
        if (sRes.ok) {
            const sData = await sRes.json();
            memberCountEl.textContent = sData.count || latestHackers.length;
            if (animateVibe && sData.vibe && sData.vibe !== lastVibe) {
                lastVibe = sData.vibe;
                typeWriter(sData.vibe.toUpperCase(), vibeTextEl, 50);
            } else if (sData.vibe) {
                vibeTextEl.textContent = sData.vibe.toUpperCase();
            }
        }
        serverStatusEl.textContent = "ONLINE";
    } catch (err) {
        console.error("Data update error:", err);
        serverStatusEl.textContent = "OFFLINE";
    }
}

function filterHackers() {
    const query = searchInputEl.value.toLowerCase().trim();
    const filtered = latestHackers.filter(h => 
        (h.name && h.name.toLowerCase().includes(query)) ||
        (h.skill && h.skill.toLowerCase().includes(query))
    );
    renderHackers(filtered);
}

function updateSkillNetwork(hackers) {
    const skills = hackers.map(h => h.skill).filter(Boolean);
    skillNetworkEl.textContent = "Network Matrix Nodes: " + [...new Set(skills)].join(" // ");
}

async function deleteUser(name) {
    const passkey = prompt("ENTER SECRET PASSKEY TO PURGE DATA:");
    if (!passkey) return;

    try {
        const res = await fetch(`${BASE_URL}/profiles`, {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, passkey })
        });
        if (!res.ok) throw new Error("Purge rejected by mainframe.");
        alert("User record destroyed.");
        updateData();
    } catch (err) {
        alert("Error: " + err.message);
    }
}

// 2. ADDED MISSING FORM SUBMIT EVENT HANDLER
joinFormEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    
    const payload = {
        name: document.getElementById("name").value,
        skill: document.getElementById("skill").value,
        github_username: document.getElementById("github").value, // Matches API requirement
        passkey: document.getElementById("passkey").value
    };

    try {
        const res = await fetch(`${BASE_URL}/profiles`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.message || "Mainframe rejected payload inject.");
        }

        joinFormEl.reset();
        await updateData(true);
        alert("TRANSMISSION SUCCESSFUL: Profile injected.");
    } catch (err) {
        alert("CRITICAL ERROR: " + err.message);
    }
});

// Setup input filtering and toggles
searchInputEl.addEventListener("input", filterHackers);
document.getElementById("toggle-skills-btn").addEventListener("click", () => {
    if (skillNetworkEl.style.display === "none") {
        skillNetworkEl.style.display = "block";
        updateSkillNetwork(latestHackers);
    } else {
        skillNetworkEl.style.display = "none";
    }
});

// Initial bootup sequences
updateData(true);
    </script>
</body>
</html>
