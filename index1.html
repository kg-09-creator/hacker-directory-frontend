<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Directory Terminal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="matrix-rain"></canvas>

    <header class="status-bar" aria-live="polite">
        STATUS: <span id="server-status" class="status-indicator">INITIALIZING...</span> | 
        MEMBERS_SYNCED: <span id="member-count">0</span>
    </header>

    <main class="terminal-container">
        <section class="terminal-card">
            <h1 id="terminal-title">> HACKER_DIRECTORY_V2.EXE</h1>
            <p>> SYSTEM_VIBE: <span id="vibe-text">ANALYZING...</span></p>
        </section>

        <section class="terminal-card">
            <h2>> SEARCH_DATABASE.exe</h2>
            <div class="search-wrapper">
                <span class="prompt-prefix">> </span>
                <input type="search" id="terminal-search" placeholder="TYPE_NAME..." autocomplete="off">
            </div>
        </section>

        <section class="terminal-card compact-section">
            <h2>> SHARED_SKILL_NETWORK.exe</h2>
            <button type="button" id="toggle-skills-btn">_ANALYZE_SKILLS</button>
            <div id="skill-network" class="hidden" aria-expanded="false"></div>
        </section>

        <section class="terminal-card">
            <h2>> JOIN_THE_MAINFRAME.exe</h2>
            <form id="join-form">
                <div class="form-grid">
                    <input type="text" id="name" placeholder="NAME" required autocomplete="off">
                    <input type="text" id="skill" placeholder="SKILL" required autocomplete="off">
                    <input type="text" id="github" placeholder="GITHUB_USER" required autocomplete="off">
                    <input type="password" id="passkey" placeholder="SECRET_PASSKEY" required>
                </div>
                <button type="submit">_SUBMIT_DATA</button>
            </form>
        </section>

        <section class="terminal-card">
            <h2>> ACTIVE_HACKER_PROFILES.exe</h2>
            <div id="hacker-list" class="profile-grid"></div>
        </section>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
